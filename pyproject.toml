[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "market-data-platform"
version = "0.1.0"
description = "A modular financial market data platform for probabilistic analysis and decision support."
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "numpy",
    "python-dotenv",
    "mysql-connector-python",
    "MetaTrader5",
    "matplotlib",
    "mplfinance",
    "reportlab",
    "tabulate>=0.9.0",
]

[tool.setuptools.packages.find]
where = ["src"]